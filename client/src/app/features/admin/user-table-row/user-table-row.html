<td>{{ index() }}</td>
<td class="image-container"><img [src]="user().profilePictureUrl ? user().profilePictureUrl : 'img/no-profile.jpg'"
         alt="{{ user().firstName }}" class="user-image" /></td>
<td>{{ user().userName }}</td>
<td>{{ user().email }}</td>
<td>{{ user().firstName }}</td>
<td>{{ user().midName || '-' }}</td>
<td>{{ user().lastName }}</td>
<td>{{ user().phoneNumber || '-' }}</td>
<td>{{ user().rolesView }} </td>
<td>
    <div class="dropdown">
        <button class="btn btn-sm btn-light text-primary me-1" type="button" id="dropdownMenuButton-{{user().id}}"
                data-bs-toggle="dropdown" data-bs-auto-close="true" aria-expanded="false" title="Управление на роли">
            <i class="fas fa-edit"></i>
        </button>
        <ul class="dropdown-menu">
            @if(isTherapist) {
            <li><button class="dropdown-item" type="button" (click)="onToggleRole('Therapist')">
                    <i class="fas fa-user-slash text-secondary"></i> Премахни терапевт
                </button></li>
            }@else {
            <li><button class="dropdown-item" type="button" (click)="onToggleRole('Therapist')">
                    <i class="fas fa-user-nurse text-primary"></i> Назначи терапевт
                </button></li>
            }

            @if(isAdministrator){
            <li><button class="dropdown-item" type="button" (click)="onToggleRole('Administrator')">
                    <i class="fas fa-user-slash text-secondary"></i> Премахни администратор
                </button></li>
            }@else {
            <li><button class="dropdown-item" type="button" (click)="onToggleRole('Administrator')">
                    <i class="fas fa-user-tie text-primary"></i> Назначи администратор
                </button></li>
            }
        </ul>
    </div>
    <button class="btn btn-sm btn-light text-danger" title="Изтрий потребител" (click)="onDeleteClick()">
        <i class="fas fa-trash"></i>
    </button>
</td>
