<div class="container-fluid bg-breadcrumb">
    <div class="container text-center py-5" style="max-width: 900px;">
        <h3 class="text-white display-3 mb-4" appScrollAnimation animationType="fadeInDown" [animationDelay]="100">403
        </h3>
        <h1 class="mb-4 text-white" appScrollAnimation animationType="fadeInUp" [animationDelay]="100">Неоторизиран достъп</h1>
    </div>
</div>
<div class="container-fluid py-5">
    <div class="container py-5 text-center">
        <div class="row justify-content-center">
            <div class="col-lg-6 wow fadeInUp" data-wow-delay="0.3s">
                <i class="fas fa-ban fa-4x text-secondary mb-5"></i>
                <p class="mb-4">Нямате права за достъп до тази страница. Моля, свържете се с администратор.</p>
                <a class="btn btn-primary rounded-pill py-3 px-5 text-white" [routerLink]="['/']">Към началната страница</a>
            </div>
        </div>
    </div>
</div>


<div class="unauthorized-container">
  <div class="error-content">
    <div class="error-icon">
      <i class="fas fa-ban fa-4x text-danger"></i>
    </div>
    <h1 class="error-title">403</h1>
    <h2 class="error-subtitle">Неоторизиран достъп</h2>
    <p class="error-description">
      Нямате права за достъп до тази страница. Моля, свържете се с администратор.
    </p>
    <div class="error-actions">
      <button 
        class="btn btn-primary me-3" 
        type="button" 
        (click)="goHome()">
        <i class="fas fa-home me-2"></i>
        Към началото
      </button>
      <button 
        class="btn btn-outline-secondary" 
        type="button" 
        (click)="goBack()">
        <i class="fas fa-arrow-left me-2"></i>
        Назад
      </button>
    </div>
  </div>
</div>
