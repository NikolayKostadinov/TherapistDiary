<div class="container-fluid bg-breadcrumb">
    <div class="container text-center py-5" style="max-width: 900px;">
        <h3 class="text-white display-3 mb-4" appScrollAnimation animationType="fadeInDown" [animationDelay]="100">404
        </h3>
        <h1 class="mb-4 text-white" appScrollAnimation animationType="fadeInUp" [animationDelay]="100">Страницата не е
            открита</h1>
    </div>
</div>
<div class="container-fluid py-5">
    <div class="container py-5 text-center">
        <div class="row justify-content-center">
            <div class="col-lg-6 wow fadeInUp" data-wow-delay="0.3s">
                <i class="bi bi-exclamation-triangle display-1 text-secondary"></i>
                <p class="mb-4">Съжаляваме, страницата, която търсите не съществува в нашия уебсайт! Може да се върнете
                    към началната страница или опитайте да използвате търсене?</p>
                <a class="btn btn-primary rounded-pill py-3 px-5 text-white" [routerLink]="['/']">Към началната
                    страница</a>
            </div>
        </div>
    </div>
</div>
